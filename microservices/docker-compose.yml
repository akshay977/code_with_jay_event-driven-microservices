version: '3'
services:

  nosql-db:
    image: mongo
    container_name: nosql-db
    ports:
      - "27017:27017"
    volumes:
      - ./db/:/data/db

  product:
    build:
      dockerfile: Dockerfile
      context: ./product
    container_name: product
    ports:
      - "8002:8002"
    restart: always
    depends_on:
      - "nosql-db"
    volumes:
      - /app/product/node_modules
      - ./product:/app/product

  shopping:
    build:
      dockerfile: Dockerfile
      context: ./shopping
    container_name: shopping
    ports:
      - "8003:8003"
    restart: always
    depends_on:
      - "nosql-db"
    volumes:
      - /app/shopping/node_modules
      - ./shopping:/app/shopping

  customer:
    build:
      dockerfile: Dockerfile
      context: ./customer
    container_name: customer
    ports:
      - "8001:8001"
    restart: always
    depends_on:
      - "nosql-db"
    volumes:
      - /app/customer/node_modules
      - ./customer:/app/customer

  nginx-proxy:
    build:
      dockerfile: Dockerfile
      context: ./proxy
    depends_on:
      - product
      - shopping
      - customer
    ports:
      - "80:80"