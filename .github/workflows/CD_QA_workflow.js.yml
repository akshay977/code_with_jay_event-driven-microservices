# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Deploy on QA

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: 

jobs:
  deploy_on_qa:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Create customer env file
      working-directory: microservices/customer
      run: |
        touch .env
        echo APP_SECRET={{ secrets.QA_APP_SECRET }} >> .env
        echo MONGODB_URI={{ secrets.QA_CUSTOMER_DB_URL }} >> .env
        echo MESSAGE_BROKER_URL={{ secrets.QA_MESSAGE_BROKER_URL }} >> .env
        echo EXCHANGE_NAME=ONLINE_SHOPPING >> .env
        echo PORT=8001 >> .env
        cat .env

    - name: Create products env file
      working-directory: microservices/product
      run: |
        touch .env
        echo APP_SECRET={{ secrets.QA_APP_SECRET }} >> .env
        echo MONGODB_URI={{ secrets.QA_PRODUCTS_DB_URL }} >> .env
        echo MESSAGE_BROKER_URL={{ secrets.QA_MESSAGE_BROKER_URL }} >> .env
        echo EXCHANGE_NAME=ONLINE_SHOPPING >> .env
        echo PORT=8002 >> .env
        cat .env
        
    - name: Create shopping env file
      working-directory: microservices/shopping
      run: |
        touch .env
        echo APP_SECRET={{ secrets.QA_APP_SECRET }} >> .env
        echo MONGODB_URI={{ secrets.QA_SHOPPING_DB_URL }} >> .env
        echo MESSAGE_BROKER_URL={{ secrets.QA_MESSAGE_BROKER_URL }} >> .env
        echo EXCHANGE_NAME=ONLINE_SHOPPING >> .env
        echo PORT=8003 >> .env
        cat .env
        
    - name: Generate deployment package
      run: |
        zip -r deploy.zip . -x '*.git'
        
